<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>N次方 - 店長菜單庫存管理後台</title>
  <style>
    :root {
      --primary: #4a6b5d;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --danger: #e53e3e;
      --success: #38a169;
      --text: #2d3748;
      --border: #edf2f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }
    
    header { background: #fff; padding: 16px; border-radius: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h1 { font-size: 1.2rem; color: var(--primary); margin-bottom: 4px; }
    p.desc { font-size: 0.82rem; color: #718096; margin-bottom: 12px; }
    
    .auth-box { display: flex; gap: 8px; }
    .auth-box input { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .auth-box button { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .section-title { font-size: 1rem; font-weight: 700; margin: 18px 0 8px; color: #4a5568; display: flex; align-items: center; gap: 6px; }
    .section-title::before { content: ""; width: 4px; height: 14px; background: var(--primary); border-radius: 2px; }
    
    .item-list { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.03); border: 1px solid var(--border); }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #edf2f7; }
    .item-row:last-child { border-bottom: none; }
    .item-name { font-weight: 600; font-size: 0.95rem; }
    .item-status-text { font-size: 0.8rem; margin-right: 8px; }
    
    /* Switch 樣式 */
    .switch-container { display: flex; align-items: center; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e0; transition: .25s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .25s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(24px); }
  </style>
</head>
<body>

  <header>
    <h1>🌿 N次方 菜單庫存管理後台</h1>
    <p class="desc">切換開關即可即時啟用/停售前台品項與配料</p>
    <div class="auth-box">
      <input type="password" id="adminPwd" placeholder="管理密碼 (預設1234)" value="1234" />
      <button onclick="fetchStatus()">重新整理</button>
    </div>
  </header>

  <div id="contentArea">
    <p style="text-align:center; color:#718096; padding:30px;">正在連線讀取庫存狀態...</p>
  </div>

  <script>
    // ★★★ 在此填入你的 Google Apps Script 部署網址 ★★★
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxvyc_rqWU-rqmrvWj73cnjkwqIiZ5tqpANFfcrlaFLCPaa5Vw1AYLFxO0lmLUMQbo_/exec";

    const ALL_ITEMS = [
      { category: "Smoothies 果昔口味與基底", items: ["香草", "草莓", "巧克力", "芒果", "咖啡", "奶香曲奇", "薄荷巧克力", "穀片", "寒天波波"] },
      { category: "優格燕麥果昔品項", items: ["草莓甜心", "光芒閃閃", "可可旋風", "天作芝核", "啡你莫屬", "薄荷夏綠蒂"] },
      { category: "機能茶系列與口味", items: ["纖體瘦瘦茶", "原味檸香", "覆盆子", "養生綠茶", "石榴", "放鬆舒活茶", "活力聰明茶"] },
      { category: "機能飲系列與口味", items: ["高蛋白咖啡", "拿鐵", "摩卡", "運動機能高蛋白飲", "蘆薈氣泡飲", "葡萄", "強健保護飲", "蜂蜜香橙"] },
      { category: "加料加購項目", items: ["原味寒天波波", "黑糖寒天波波", "加麥片/穀片", "環保外帶瓶"] }
    ];

    let currentStatus = {};

    window.addEventListener('DOMContentLoaded', fetchStatus);

    function fetchStatus() {
      if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL.includes("你的_GOOGLE")) {
        alert("請先在程式碼中填入 Google Apps Script 網址！");
        return;
      }

      document.getElementById('contentArea').innerHTML = '<p style="text-align:center; color:#718096; padding:30px;">正在連線讀取庫存狀態...</p>';

      fetch(GAS_WEBAPP_URL)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            currentStatus = res.data || {};
            renderList();
          } else {
            alert('讀取失敗：' + (res.message || '未知錯誤'));
          }
        })
        .catch(err => {
          console.error(err);
          alert('連線失敗，請檢查網路或 GAS 網址與權限設定！');
        });
    }

    function renderList() {
      let html = '';
      ALL_ITEMS.forEach(cat => {
        html += `<div class="section-title">${cat.category}</div><div class="item-list">`;
        cat.items.forEach(name => {
          const isAvail = currentStatus[name] !== false; // 預設皆為 true 供應中
          html += `
            <div class="item-row">
              <span class="item-name">${name}</span>
              <div class="switch-container">
                <span class="item-status-text" style="color: ${isAvail ? 'var(--success)' : 'var(--danger)'};">
                  ${isAvail ? '供應中' : '已售完'}
                </span>
                <label class="switch">
                  <input type="checkbox" ${isAvail ? 'checked' : ''} onchange="toggleItem('${name}', this)">
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      });
      document.getElementById('contentArea').innerHTML = html;
    }

    function toggleItem(itemName, checkboxEl) {
      const pwd = document.getElementById('adminPwd').value;
      if (!pwd) {
        alert('請輸入管理密碼！');
        checkboxEl.checked = !checkboxEl.checked; // 復原勾選
        return;
      }

      const isAvailable = checkboxEl.checked;
      const statusText = checkboxEl.parentElement.previousElementSibling;
      statusText.innerText = "更新中...";
      statusText.style.color = "#a0aec0";

      fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: "updateStatus",
          password: pwd,
          itemName: itemName,
          isAvailable: isAvailable
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          currentStatus[itemName] = isAvailable;
          statusText.innerText = isAvailable ? '供應中' : '已售完';
          statusText.style.color = isAvailable ? 'var(--success)' : 'var(--danger)';
        } else {
          alert('更新失敗：' + (res.message || '密碼錯誤'));
          checkboxEl.checked = !isAvailable; // 復原
          statusText.innerText = !isAvailable ? '供應中' : '已售完';
          statusText.style.color = !isAvailable ? 'var(--success)' : 'var(--danger)';
        }
      })
      .catch(err => {
        alert('網路連線逾時，狀態未儲存');
        checkboxEl.checked = !isAvailable;
        statusText.innerText = !isAvailable ? '供應中' : '已售完';
        statusText.style.color = !isAvailable ? 'var(--success)' : 'var(--danger)';
      });
    }
  </script>
</body>
</html>
