<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N次方 - 店長工作台 (訂單監控 ＆ 庫存管理)</title>
    <style>
        :root {
            --morandi-bg: #f4efed;
            --morandi-card: #ffffff;
            --morandi-primary: #8e5b52;
            --morandi-accent: #b07d72;
            --morandi-text: #2c2220;
            --border-color: #d1c2be;
            --green: #28a745;
            --red: #dc3545;
        }

        body {
            font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            background-color: var(--morandi-bg);
            color: var(--morandi-text);
            margin: 0;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-card {
            background: var(--morandi-card);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(142, 91, 82, 0.1);
            border: 1px solid var(--border-color);
        }

        .card-header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1, h2 {
            margin: 0;
            color: var(--morandi-primary);
            font-weight: bold;
        }
        h1 { font-size: 22px; }
        h2 { font-size: 18px; }

        .hint-bar {
            font-size: 13px;
            font-weight: bold;
            color: #735753;
            background: #faf6f5;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="range"] {
            accent-color: var(--morandi-primary);
            cursor: pointer;
        }

        #order-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .order-card {
            background: #faf6f5;
            padding: 16px;
            border-left: 8px solid var(--morandi-primary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            text-align: left;
        }

        .order-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #735753;
            font-weight: bold;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .order-badge {
            background: var(--morandi-primary);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .cust-info-box {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .cust-name { color: var(--morandi-primary); }
        .cust-phone { color: var(--green); }

        .order-details {
            font-size: 15px;
            font-weight: bold;
            line-height: 1.6;
            white-space: pre-line;
            margin: 8px 0;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed var(--border-color);
            padding-top: 6px;
            margin-top: 8px;
            font-size: 13px;
        }

        .order-price {
            font-size: 17px;
            color: var(--morandi-primary);
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #735753;
            font-weight: bold;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
        }

        .btn-refresh {
            background: var(--morandi-primary);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .category-group {
            margin-top: 16px;
        }

        .category-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--morandi-primary);
            background: #faf6f5;
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 15px;
        }

        .switch-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-available { background-color: var(--green); color: white; }
        .btn-soldout { background-color: var(--red); color: white; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 上半部：即時訂單監控台 -->
        <div class="section-card">
            <div class="card-header">
                <h1>🔔 即時訂單監控</h1>
                <div class="volume-box">
                    <label for="volume" style="font-size: 13px; font-weight: bold;">🔊 音效音量</label>
                    <input type="range" id="volume" min="0" max="1" step="0.1" value="1.0" />
                </div>
            </div>
            <div class="hint-bar">
                <span>💡 點擊網頁任意處解鎖自動響鈴與語音播報</span>
                <span id="sync-status">連線中...</span>
            </div>
            <div id="order-container">
                <div class="empty-state">等待新訂單中...</div>
            </div>
        </div>

        <!-- 2. 下半部：菜單庫存管理後台 -->
        <div class="section-card">
            <div class="card-header">
                <h2>🌿 菜單庫存狀態管理</h2>
                <button class="btn-refresh" onclick="loadStockAndOrders()">重新整理</button>
            </div>
            <div id="stock-list-container">載入中...</div>
        </div>
    </div>

<script>
        // 對應您最新部署的 GAS 網址（已補好雙引號）
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwTi8-IT-GZwMDNuAHx-lbqli30MbhiLw7YvaWOswBxhno42a2bQBNcLy-R6CG83jlI/exec";

        let stockStatus = {};
        let dynamicMenuData = [];
        let knownOrderTimestamps = new Set();
        let isFirstLoad = true;

        function formatDisplayTime(timeStr) {
            const d = new Date(timeStr);
            if (isNaN(d.getTime())) return timeStr;
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        // 💡 語音播報功能
        function speakOrder(orderNo, details, price, notes) {
            if ('speechSynthesis' in window) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
                window.speechSynthesis.cancel(); // 清除排隊中的語音

                const volume = document.getElementById('volume').value;
                const cleanDetails = details.replace(/\$/g, '');
                const cleanPrice = String(price).replace(/\$/g, '');
                
                // 檢查備註：如果是空值、或者等於「無」，就完全不唸；有其他內容才在總金額前唸出
                let notesText = "";
                const cleanNotes = (notes || "").trim();
                if (cleanNotes && cleanNotes !== "無") {
                    notesText = `，備註：${cleanNotes}`;
                }

                const textToSpeak = `號碼 ${orderNo}，新訂單！內容是： ${cleanDetails}${notesText}。總金額為： ${cleanPrice} 元。`;
                const msg = new SpeechSynthesisUtterance(textToSpeak);
                msg.volume = Number(volume);
                msg.rate = 1.2; // 語速微調
    
                // 💡 自動抓取裝置內可用的中文語音，優先選擇微軟或 Google 的自然語音
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh-CN');
                if (zhVoice) {
                    msg.voice = zhVoice;
                }

                window.speechSynthesis.speak(msg);
            }
        }

        // 確保瀏覽器載入完語音清單
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 💡 使用瀏覽器內建音效合成，百分之百穩定響起「叮咚」聲
        function playAlertAndSpeak(orderNo, details, price, notes) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const volume = Number(document.getElementById('volume').value);

                // 播放「叮」高音
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5 音符
                gain1.gain.setValueAtTime(volume * 0.5, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start();
                osc1.stop(audioCtx.currentTime + 0.4);

                // 0.3秒後播放「咚」低音
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.3); // C5 音符
                gain2.gain.setValueAtTime(volume * 0.5, audioCtx.currentTime + 0.3);
                gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(audioCtx.currentTime + 0.3);
                osc2.stop(audioCtx.currentTime + 0.8);

            } catch (e) {
                console.log("音效合成略過", e);
            }

            // 叮咚響完後，無縫接軌語音播報（已成功帶入 notes 參數）
            setTimeout(() => speakOrder(orderNo, details, price, notes), 900);
        }

        function loadStockAndOrders() {
            fetch(GAS_WEBAPP_URL)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        document.getElementById('sync-status').innerText = "🟢 正常同步中";
                        if (res.data) {
                            stockStatus = res.data;
                        }
                        if (res.menu) {
                            dynamicMenuData = res.menu;
                        }
                        renderStockList();
                        if (res.orders) {
                            renderOrders(res.orders);
                        }
                    }
                })
                .catch(err => {
                    console.error("連線錯誤", err);
                    document.getElementById('sync-status').innerText = "🔴 連線異常";
                });
        }

        function renderOrders(orders) {
            const container = document.getElementById('order-container');
            const oneHourAgo = new Date().getTime() - (60 * 60 * 1000);
            const recentOrders = orders.filter(order => {
                const orderTime = new Date(order.time).getTime();
                return isNaN(orderTime) || orderTime >= oneHourAgo;
            });

            if (recentOrders.length === 0) {
                container.innerHTML = '<div class="empty-state">目前一小時內無新訂單</div>';
                return;
            }

            recentOrders.sort((a, b) => new Date(b.time) - new Date(a.time));
            let html = "";

            recentOrders.forEach(order => {
                const orderKey = `${order.time}_${order.orderNo}`;
                if (!isFirstLoad && !knownOrderTimestamps.has(orderKey)) {
                    // 💡 修正處：在此處補上 order.notes 參數，讓語音可以唸出備註
                    playAlertAndSpeak(order.orderNo, order.details, order.totalPrice, order.notes);
                }
                knownOrderTimestamps.add(orderKey);

                const cleanDetailsForDisplay = (order.details || '').replace(/\(\$(\d+)\)/g, '($1元)');

                html += `
                    <div class="order-card">
                        <div class="order-header-row">
                            <span class="order-badge">🎫 取餐號碼：${order.orderNo || '無單號'}</span>
                            <span>⏰ 取餐：${order.pickupTime || '現場即取'}</span>
                        </div>
                        <div style="font-size:12px; color:#888; margin-bottom:6px;">🕒 下單時間：${formatDisplayTime(order.time)}</div>
                        <div class="cust-info-box">
                            <span class="cust-name">👤 顧客：${order.name || '未填寫'}</span>
                            <span class="cust-phone">📞 電話：${order.phone || '未填寫'}</span>
                        </div>
                        <div class="order-details">📋 餐點內容：<br>${cleanDetailsForDisplay}</div>
                        <div class="order-footer">
                            <span>📝 備註：${order.notes || '無'}</span>
                            <span class="order-price">💰 總金額：${order.totalPrice} 元</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            isFirstLoad = false;
        }

        function renderStockList() {
            const container = document.getElementById('stock-list-container');
            if (!dynamicMenuData || dynamicMenuData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#735753;">目前無菜單資料或載入中...</div>';
                return;
            }

            let grouped = {};
            dynamicMenuData.forEach(item => {
                let sec = item.sectionTitle || '其他品項';
                if (!grouped[sec]) grouped[sec] = [];
                grouped[sec].push(item);
            });

            let html = "";
            for (let sectionTitle in grouped) {
                html += `<div class="category-group"><div class="category-title">${sectionTitle}</div>`;
                
                grouped[sectionTitle].forEach(item => {
                    const itemName = item.name;
                    const isAvail = stockStatus[itemName] !== false;

                    html += `
                        <div class="stock-row">
                            <span>${itemName}</span>
                            <button class="switch-btn ${isAvail ? 'btn-available' : 'btn-soldout'}" onclick="toggleStock('${itemName}', ${!isAvail})">
                                ${isAvail ? '供應中' : '已售完'}
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // 切換庫存狀態（免密碼直接更新）
        function toggleStock(itemName, newStatus) {
            fetch(GAS_WEBAPP_URL, {
                method: "POST",
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: "updateStatus",
                    itemName: itemName,
                    isAvailable: newStatus
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    stockStatus[itemName] = newStatus;
                    renderStockList();
                } else {
                    alert(res.message || "更新失敗");
                }
            })
            .catch(err => alert("網路連線錯誤"));
        }

        document.body.onclick = () => {
            if (window.speechSynthesis && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }
        };

        loadStockAndOrders();
        setInterval(loadStockAndOrders, 2000);
    </script>
</body>
</html>
