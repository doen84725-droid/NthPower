<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N次方營養吧訂單監控台</title>
    <style>
        :root {
            --morandi-bg: #f4efed;        /* 整體柔和粉棕背景 */
            --morandi-card: #ffffff;     /* 卡片純白底色 */
            --morandi-primary: #8e5b52;  /* 加深後的莫蘭迪深粉棕主色（對比更明顯） */
            --morandi-accent: #b07d72;   /* 溫潤粉棕點綴 */
            --morandi-text: #2c2220;     /* 改用極深的可可黑棕色，字體超級清晰 */
            --border-color: #d1c2be;     /* 加深邊框色 */
        }

        body { 
            font-family: 'Microsoft JhengHei', sans-serif; 
            padding: 20px; 
            background-color: var(--morandi-bg); 
            color: var(--morandi-text);
            margin: 0;
        }

        .container { 
            max-width: 650px; 
            margin: auto; 
        }

        .header-box {
            background: var(--morandi-card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(142, 91, 82, 0.12);
            text-align: center;
            border-bottom: 4px solid var(--morandi-primary);
            margin-bottom: 20px;
        }

        h1 { 
            color: var(--morandi-primary); 
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-text {
            font-size: 15px;
            color: #594441; /* 加深提示文字顏色 */
            font-weight: bold;
            margin-bottom: 15px;
        }

        #volume-control { 
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #faf6f5;
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-weight: bold;
            color: var(--morandi-text);
        }

        input[type="range"] {
            accent-color: var(--morandi-primary);
            cursor: pointer;
        }

        #order-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card { 
            background: var(--morandi-card); 
            padding: 22px; 
            border-left: 10px solid var(--morandi-primary); 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(142, 91, 82, 0.1); 
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
            transition: transform 0.2s;
        }

        .order-card:hover {
            transform: translateY(-2px);
        }

        .order-time {
            font-size: 14px;
            color: #735753;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .order-details {
            font-size: 16px; /* 稍微加大字體 */
            color: var(--morandi-text);
            line-height: 1.7;
            font-weight: bold; /* 全面改用粗體讓內容更顯眼 */
            white-space: pre-line;
            margin: 12px 0;
        }

        .order-price {
            font-size: 18px; /* 加大金額字體 */
            color: var(--morandi-primary);
            font-weight: bold;
            text-align: right;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #735753;
            font-weight: bold;
            background: var(--morandi-card);
            border-radius: 8px;
            border: 2px dashed var(--border-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>☕ N次方營養吧訂單監控台</h1>
            <div class="status-text">💡 提示：點擊頁面任意處以解鎖音效與語音播報權限</div>
            <div id="volume-control">
                <label for="volume">🔊 語音與鈴聲音量：</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="0.6">
            </div>
        </div>

        <div id="order-container">
            <div class="empty-state">等待新訂單中...</div>
        </div>
    </div>

    <script>
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby0THsBLvRWcDz4kSzgC2yO990OwXB0Bi6g7fNwkRTWrvUvOLwuw7Imv9H00GiWuZxR/exec"; 
        
        let knownOrderTimestamps = new Set();
        let isFirstLoad = true;

        function speakOrder(details, price) {
            const volume = document.getElementById('volume').value;
            const textToSpeak = `有新訂單！內容是，${details}。總金額，${price}元整。`;
            const msg = new SpeechSynthesisUtterance(textToSpeak);
            msg.volume = volume;
            msg.lang = 'zh-TW';
            window.speechSynthesis.speak(msg);
        }

        function playAlertAndSpeak(details, price) {
            const volume = document.getElementById('volume').value;
            const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
            audio.volume = volume;
            
            audio.play().then(() => {
                setTimeout(() => {
                    speakOrder(details, price);
                }, 800);
            }).catch(e => {
                console.log("音效播放受阻");
                speakOrder(details, price);
            });
        }

        function fetchOrders() {
            fetch(GAS_WEBAPP_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success" && data.orders) {
                        const container = document.getElementById('order-container');
                        let newOrdersHtml = "";

                        const oneHourAgo = new Date().getTime() - (60 * 60 * 1000);
                        const recentOrders = data.orders.filter(order => {
                            const orderTime = new Date(order.time).getTime();
                            return orderTime >= oneHourAgo;
                        });

                        if (recentOrders.length === 0) {
                            container.innerHTML = `<div class="empty-state">目前一小時內無新訂單</div>`;
                            return;
                        }

                        recentOrders.sort((a, b) => new Date(b.time) - new Date(a.time));

                        recentOrders.forEach(order => {
                            if (!isFirstLoad && !knownOrderTimestamps.has(order.time)) {
                                playAlertAndSpeak(order.details, order.totalPrice);
                            }
                            knownOrderTimestamps.add(order.time);

                            newOrdersHtml += `
                                <div class="order-card">
                                    <div class="order-time">🕒 下單時間：${order.time}</div>
                                    <div class="order-details">📋 內容：<br>${order.details}</div>
                                    <div class="order-price">💰 總金額：$${order.totalPrice} 元</div>
                                </div>
                            `;
                        });

                        container.innerHTML = newOrdersHtml;
                        isFirstLoad = false;
                    }
                })
                .catch(err => console.error("連線錯誤", err));
        }

        document.body.onclick = () => {
            console.log("權限已解鎖");
        };

        setInterval(fetchOrders, 5000);
        fetchOrders();
    </script>
</body>
</html>
